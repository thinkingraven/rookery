name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: docs/rules.md is up to date
        if: matrix.node == 24
        run: npm run docs --silent && git diff --exit-code docs/rules.md

  self-scan:
    name: rookery scans itself (via the action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          fail-on: high
          html: rookery-report.html
          sarif: rookery.sarif
      - uses: actions/upload-artifact@v7
        with:
          name: rookery-report
          path: |
            rookery-report.html
            rookery.sarif
      - name: Upload SARIF to code scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rookery.sarif
          category: rookery
