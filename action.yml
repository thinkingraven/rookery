name: rookery
description: Find AI agent skills, near-duplicates and risky instructions across Claude Code, Codex, Cursor, Copilot, Gemini and MCP.
author: Thinking Raven
branding:
  icon: feather
  color: orange

inputs:
  path:
    description: Folders to scan, separated by spaces.
    default: .
  fail-on:
    description: Fail the job on high-confidence findings at or above this severity (critical, high, medium, low). Leave empty to never fail.
    default: high
  html:
    description: Also write a self-contained HTML report to this path (upload it with actions/upload-artifact).
    default: ''
  sarif:
    description: Also write SARIF 2.1.0 to this path (upload it with github/codeql-action/upload-sarif to see findings in code scanning).
    default: ''
  policy:
    description: Path to a .rookery.yml policy. When set, or when .rookery.yml exists at the repo root, the action runs `rookery check` and the policy's fail_on replaces the fail-on input.
    default: ''
  args:
    description: Extra CLI options, for example "--strict --threshold 0.6".
    default: ''

runs:
  using: composite
  steps:
    - name: Build rookery
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund --loglevel=error && npm run build --silent

    - name: Scan
      shell: bash
      env:
        ROOKERY_CLI: ${{ github.action_path }}/dist/src/cli.js
        ROOKERY_PATH: ${{ inputs.path }}
        ROOKERY_FAIL_ON: ${{ inputs.fail-on }}
        ROOKERY_HTML: ${{ inputs.html }}
        ROOKERY_SARIF: ${{ inputs.sarif }}
        ROOKERY_POLICY: ${{ inputs.policy }}
        ROOKERY_ARGS: ${{ inputs.args }}
        FORCE_COLOR: '1'
      # Inputs arrive through env, never interpolated into the script.
      run: |
        set -f
        if [ -n "$ROOKERY_POLICY" ] || [ -f .rookery.yml ] || [ -f .rookery.yaml ]; then
          args=(check $ROOKERY_PATH --md "$GITHUB_STEP_SUMMARY")
          if [ -n "$ROOKERY_POLICY" ]; then args+=(--policy "$ROOKERY_POLICY"); fi
        else
          args=(scan $ROOKERY_PATH --md "$GITHUB_STEP_SUMMARY")
          if [ -n "$ROOKERY_FAIL_ON" ]; then args+=(--fail-on "$ROOKERY_FAIL_ON"); fi
        fi
        if [ -n "$ROOKERY_HTML" ]; then args+=(--html "$ROOKERY_HTML"); fi
        if [ -n "$ROOKERY_SARIF" ]; then args+=(--sarif "$ROOKERY_SARIF"); fi
        node "$ROOKERY_CLI" "${args[@]}" $ROOKERY_ARGS
